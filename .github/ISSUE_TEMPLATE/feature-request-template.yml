name: Feature Request
description: Use this template if there’s a feature you’d like to propose for the project.
title: "[FEATURE REQUEST] - <Brief description>"
labels: ["enhancement"]
assignees:
  - CerbonXD
body:
  - type: checkboxes
    id: pre_checks
    attributes:
      label: Before submitting the feature request
      options:
        - label: "**I have checked that the requested feature is not a duplicate or, if it is, it needs to be reopened**"
          required: true
        - label: "**I have checked that I am running the latest version of the mod**"
          required: true
        - label: "**I have checked the [FAQ](https://github.com/CERBON-MODS/.github/blob/master/FAQ.md) section for solutions**" #[cite: 2]
          required: true
        - label: "**I have read the [contributing guidelines](https://github.com/CERBON-MODS/.github/blob/master/CONTRIBUTING.md#feature-requests) and I agree with the [Code of Conduct](https://github.com/CERBON-MODS/.github/blob/master/CODE_OF_CONDUCT.md)**"
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution/feature you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false